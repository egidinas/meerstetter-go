<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meerstetter Gateway Console</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d1117;
      --panel: #151b23;
      --panel-2: #1c2430;
      --text: #e6edf3;
      --muted: #8b949e;
      --line: #30363d;
      --ok: #3fb950;
      --warn: #d29922;
      --bad: #f85149;
      --accent: #58a6ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header {
      display: flex;
      gap: 16px;
      align-items: center;
      justify-content: space-between;
      padding: 18px 22px;
      border-bottom: 1px solid var(--line);
      background: #0b1016;
    }
    h1, h2 { margin: 0; font-weight: 650; letter-spacing: 0; }
    h1 { font-size: 20px; }
    h2 { font-size: 15px; color: var(--muted); }
    main {
      display: grid;
      grid-template-columns: minmax(280px, 360px) minmax(0, 1fr);
      gap: 16px;
      padding: 16px;
    }
    section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      min-width: 0;
    }
    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 13px 14px;
      border-bottom: 1px solid var(--line);
    }
    .content { padding: 14px; }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 30px;
      padding: 5px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: var(--panel-2);
      white-space: nowrap;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--warn);
    }
    .dot.ok { background: var(--ok); }
    .dot.bad { background: var(--bad); }
    .toolbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      margin-bottom: 12px;
    }
    input, select, button {
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #0d1117;
      color: var(--text);
      font: inherit;
    }
    input, select { width: 100%; padding: 6px 9px; }
    button {
      padding: 6px 10px;
      cursor: pointer;
      background: #21262d;
    }
    button:hover { border-color: var(--accent); }
    .device-list {
      display: grid;
      gap: 8px;
    }
    .device {
      width: 100%;
      text-align: left;
      padding: 10px;
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .device.active { border-color: var(--accent); }
    .device strong {
      display: block;
      font-size: 14px;
    }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 7px;
      color: var(--muted);
      font-size: 12px;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 2px 7px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #0d1117;
      white-space: nowrap;
    }
    .chip.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok), var(--line) 55%); }
    .chip.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn), var(--line) 55%); }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }
    .metric {
      min-height: 86px;
      padding: 12px;
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .metric small {
      display: block;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .metric b {
      display: block;
      font-size: 23px;
      font-weight: 650;
      overflow-wrap: anywhere;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      padding: 8px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }
    th {
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }
    td { overflow-wrap: anywhere; }
    .split {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(260px, 360px);
      gap: 16px;
      margin-top: 16px;
    }
    pre {
      margin: 0;
      max-height: 220px;
      overflow: auto;
      padding: 12px;
      border-radius: 8px;
      background: #06090f;
      color: #c9d1d9;
      border: 1px solid var(--line);
      white-space: pre-wrap;
    }
    @media (max-width: 980px) {
      main, .split { grid-template-columns: 1fr; }
      .grid { grid-template-columns: 1fr; }
      header { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Meerstetter Gateway Console</h1>
      <h2 id="subtitle">same-origin API</h2>
    </div>
    <div class="status"><span id="healthDot" class="dot"></span><span id="healthText">checking</span></div>
  </header>

  <main>
    <section>
      <div class="section-head">
        <h2>Devices</h2>
        <button id="refresh">Refresh</button>
      </div>
      <div class="content">
        <div class="toolbar">
          <input id="gateway" aria-label="Gateway URL" placeholder="Gateway URL">
          <button id="saveGateway">Use</button>
        </div>
        <div id="devices" class="device-list"></div>
      </div>
    </section>

    <section>
      <div class="section-head">
        <h2 id="deviceTitle">No device selected</h2>
        <span id="leaseState" class="chip">lease unknown</span>
      </div>
      <div class="content">
        <div class="grid" id="metrics"></div>
        <div class="split">
          <section>
            <div class="section-head">
              <h2>Catalogue</h2>
              <button id="readSample">Read sample</button>
            </div>
            <div class="content" style="padding:0">
              <table>
                <thead>
                  <tr><th>Type</th><th>Subtype</th><th>Parameter</th><th>Instance</th><th>Unit</th><th>Priority</th></tr>
                </thead>
                <tbody id="catalogue"></tbody>
              </table>
            </div>
          </section>
          <section>
            <div class="section-head">
              <h2>Lease</h2>
              <button id="releaseLease">Release</button>
            </div>
            <div class="content">
              <div class="toolbar">
                <input id="holder" aria-label="Lease holder" value="gateway-ui">
                <button id="acquireLease">Acquire</button>
              </div>
              <pre id="log"></pre>
            </div>
          </section>
        </div>
      </div>
    </section>
  </main>

  <script>
    const state = {
      gateway: localStorage.getItem("mecomgw.gateway") || "",
      devices: [],
      catalogue: [],
      leases: [],
      selected: "",
      leaseToken: "",
    };

    const $ = (id) => document.getElementById(id);

    function api(path) {
      const base = state.gateway.replace(/\/$/, "");
      return `${base}${path}`;
    }

    function log(value) {
      const text = typeof value === "string" ? value : JSON.stringify(value, null, 2);
      $("log").textContent = `${new Date().toLocaleTimeString()} ${text}\n\n${$("log").textContent}`.trim();
    }

    async function fetchJSON(path, init) {
      const res = await fetch(api(path), init);
      const text = await res.text();
      let body = text;
      try { body = text ? JSON.parse(text) : {}; } catch (_) {}
      if (!res.ok) throw new Error(typeof body === "string" ? body : JSON.stringify(body));
      return body;
    }

    async function refreshAll() {
      $("subtitle").textContent = state.gateway || "same-origin API";
      $("gateway").value = state.gateway;
      try {
        const [health, devices, catalogue, leases] = await Promise.all([
          fetchJSON("/api/healthz"),
          fetchJSON("/api/devices"),
          fetchJSON("/api/catalogue"),
          fetchJSON("/api/leases"),
        ]);
        $("healthDot").className = "dot ok";
        $("healthText").textContent = health.status || "ok";
        state.devices = devices.devices || [];
        state.catalogue = catalogue.parameters || [];
        state.leases = leases.leases || [];
        if (!state.selected && state.devices.length) state.selected = state.devices[0].id;
        render();
      } catch (err) {
        $("healthDot").className = "dot bad";
        $("healthText").textContent = "offline";
        log(err.message);
      }
    }

    function render() {
      $("devices").innerHTML = state.devices.map((d) => `
        <button class="device ${d.id === state.selected ? "active" : ""}" data-device="${d.id}">
          <strong>${escapeHTML(d.label || d.id)}</strong>
          <div class="meta">
            <span class="chip">${escapeHTML(d.id)}</span>
            <span class="chip">${escapeHTML(d.endpoint)}</span>
            <span class="chip">addr ${d.address}</span>
            <span class="chip ${d.bound ? "ok" : ""}">${d.bound ? "bound" : "lazy"}</span>
            ${d.last_error ? `<span class="chip warn">${escapeHTML(d.last_error)}</span>` : ""}
          </div>
        </button>
      `).join("");
      document.querySelectorAll("[data-device]").forEach((button) => {
        button.addEventListener("click", () => {
          state.selected = button.dataset.device;
          render();
        });
      });

      const current = state.devices.find((d) => d.id === state.selected);
      $("deviceTitle").textContent = current ? (current.label || current.id) : "No device selected";
      const lease = state.leases.find((l) => l.device_id === state.selected);
      $("leaseState").textContent = lease ? `leased by ${lease.holder}` : "lease free";
      $("leaseState").className = `chip ${lease ? "warn" : "ok"}`;

      $("metrics").innerHTML = [
        ["Device", current ? current.id : "-"],
        ["Endpoint", current ? current.endpoint : "-"],
        ["Address", current ? current.address : "-"],
      ].map(([label, value]) => `<div class="metric"><small>${label}</small><b>${escapeHTML(String(value))}</b></div>`).join("");

      $("catalogue").innerHTML = state.catalogue.map((p) => `
        <tr>
          <td>tec</td>
          <td>${escapeHTML(p.sensor || p.type || "")}</td>
          <td>${escapeHTML(p.name || String(p.id))}<div class="meta"><span>${p.id}</span></div></td>
          <td>${p.instance}</td>
          <td>${escapeHTML(p.unit || "")}</td>
          <td>${p.high_priority ? "high" : "normal"}</td>
        </tr>
      `).join("");
    }

    async function acquireLease() {
      if (!state.selected) return;
      const body = JSON.stringify({holder: $("holder").value || "gateway-ui", ttl: "5m"});
      const lease = await fetchJSON(`/api/devices/${encodeURIComponent(state.selected)}/lease`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body,
      });
      state.leaseToken = lease.token;
      log(lease);
      await refreshAll();
    }

    async function releaseLease() {
      if (!state.selected || !state.leaseToken) return;
      await fetch(api(`/api/devices/${encodeURIComponent(state.selected)}/lease`), {
        method: "DELETE",
        headers: {"X-Lease-Token": state.leaseToken},
      });
      state.leaseToken = "";
      log("lease released");
      await refreshAll();
    }

    async function readSample() {
      if (!state.selected) return;
      const params = state.catalogue.slice(0, 6).map((p) => `${p.id}:${p.instance}`).join(",");
      const result = await fetchJSON(`/api/devices/${encodeURIComponent(state.selected)}/read?params=${encodeURIComponent(params)}`);
      log(result);
    }

    function escapeHTML(value) {
      return value.replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[ch]));
    }

    $("refresh").addEventListener("click", refreshAll);
    $("saveGateway").addEventListener("click", () => {
      state.gateway = $("gateway").value.trim();
      localStorage.setItem("mecomgw.gateway", state.gateway);
      refreshAll();
    });
    $("acquireLease").addEventListener("click", () => acquireLease().catch((err) => log(err.message)));
    $("releaseLease").addEventListener("click", () => releaseLease().catch((err) => log(err.message)));
    $("readSample").addEventListener("click", () => readSample().catch((err) => log(err.message)));

    refreshAll();
  </script>
</body>
</html>
